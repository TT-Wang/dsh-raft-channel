name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  published-dsh:
    name: published DSH 0.1.7-rc.2 (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Verify the declared Node 22 floor, the Node 22 patch used for local validation, and Node 24.
        node: ['22.19.0', '22.22.3', '24.x']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@v4
        with:
          version: '11.7.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm peers check
      - run: npm run typecheck
      - run: npm test
      # lib/ is committed because Git installs do not build; fail on any drift.
      - name: Rebuild and verify Git-install artifacts
        run: |
          npm run build
          drift="$(git status --porcelain --untracked-files=all --ignored=matching -- lib)"
          if [ -n "$drift" ]; then
            echo "Generated lib/ differs from the committed artifacts. Rebuild and commit every generated file:"
            echo "$drift"
            exit 1
          fi
